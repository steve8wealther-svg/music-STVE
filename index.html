<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#315c31">
  <meta name="description" content="Pemutar Musik Lokal Tema Minecraft Berbasis Web & PWA dengan Penyimpanan Permanen">
  <title>Minecraft Music Player</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --grass: #5f9f3d;
      --grass-dark: #356b2f;
      --dirt: #70462b;
      --dirt-light: #985d38;
      --stone: #4b5051;
      --stone-light: #747979;
      --coal: #151b1d;
      --panel: #263032;
      --paper: #e7ddc0;
      --redstone: #d64035;
      --gold: #e5b851;
      --line: #111718;
    }

    * { box-sizing: border-box; }

    html { background: #315c31; }

    body {
      width: 100%;
      margin: 0;
      min-height: 100vh;
      color: var(--paper);
      font-family: "DM Sans", sans-serif;
      background-color: #315c31;
      background-image:
        linear-gradient(90deg, rgba(0,0,0,.13) 50%, transparent 50%),
        linear-gradient(rgba(0,0,0,.13) 50%, transparent 50%),
        linear-gradient(90deg, transparent 50%, rgba(255,255,255,.06) 50%),
        linear-gradient(transparent 50%, rgba(255,255,255,.06) 50%);
      background-size: 32px 32px, 32px 32px, 64px 64px, 64px 64px;
    }

    button, label { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, label:focus-within {
      outline: 4px solid #f5d66d;
      outline-offset: 4px;
    }

    .player-shell {
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 34px 18px;
      position: relative;
      overflow: hidden;
    }

    .player-card {
      width: 100%;
      max-width: 650px;
      position: relative;
      z-index: 1;
      overflow: hidden;
      padding: clamp(22px, 5vw, 40px);
      border: 6px solid var(--line);
      background-color: var(--panel);
      background-image:
        linear-gradient(90deg, rgba(255,255,255,.05) 50%, transparent 50%),
        linear-gradient(rgba(255,255,255,.04) 50%, transparent 50%);
      background-size: 14px 14px;
      box-shadow: 10px 10px 0 #152221, 17px 17px 0 rgba(0,0,0,.3);
    }

    .player-card::before {
      content: "";
      position: absolute;
      inset: 8px;
      border: 3px solid rgba(231,221,192,.22);
      pointer-events: none;
    }

    .top-row {
      position: relative;
      display: flex;
      gap: 18px;
      align-items: flex-start;
      justify-content: space-between;
      padding-right: 112px;
    }

    .eyebrow-container {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 9px;
      flex-wrap: wrap;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      color: #c9d6b6;
      font-size: .69rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 11px;
      height: 11px;
      background: var(--redstone);
      box-shadow: 4px 4px 0 #741f20;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: #d64035;
      color: #fff8db;
      border: 2px solid #111718;
      font-family: inherit;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 2px 2px 0 #111718;
      transition: transform 100ms steps(2, end);
    }

    .action-btn:hover {
      transform: translate(-2px, -2px);
      background: #e64a3e;
    }

    .action-btn.secondary {
      background: #4b5051;
    }
    .action-btn.secondary:hover {
      background: #5d6364;
    }

    .pwa-install-btn {
      display: none;
    }

    h1 {
      margin: 0;
      text-transform: uppercase;
      text-shadow: 3px 3px 0 #0e1414;
    }

    .jukebox {
      position: absolute;
      right: 0;
      top: 0;
      width: 92px;
      height: 92px;
      border: 5px solid #271a14;
      background:
        linear-gradient(90deg, transparent 42%, rgba(37,20,12,.45) 42% 58%, transparent 58%),
        linear-gradient(rgba(255,223,156,.16) 50%, transparent 50%),
        #8b4d2b;
      background-size: 23px 100%, 100% 23px, auto;
      box-shadow: 6px 6px 0 #3d241b;
    }

    .jukebox::before {
      content: "";
      position: absolute;
      width: 52px;
      height: 52px;
      left: 15px;
      top: 15px;
      border: 8px solid #191d1d;
      background: radial-gradient(circle, #dc5b47 0 8%, #e5b851 9% 16%, #242a2b 17% 57%, #596061 58% 62%, #1b2020 63%);
      box-shadow: inset 0 0 0 3px #080b0b;
    }

    .upload-button {
      width: 100%;
      min-height: 54px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 24px;
      padding: 13px 18px;
      border: 4px solid #1a251d;
      cursor: pointer;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: .05em;
      box-shadow: 5px 5px 0 #132016;
      transition: transform 120ms steps(2, end), box-shadow 120ms steps(2, end), filter 120ms ease;
    }

    .upload-button:hover {
      transform: translate(-3px, -3px);
      box-shadow: 8px 8px 0 #132016;
      filter: brightness(1.12);
    }

    input[type="file"] { display: none; }

    .track-info {
      min-height: 124px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin-top: 21px;
      padding: 18px 17px;
      border: 4px solid #171f20;
      background: #d9d0b1;
      color: #1c2525;
      box-shadow: inset 4px 4px 0 rgba(255,255,255,.35), inset -4px -4px 0 rgba(81,73,55,.32);
    }

    .track-title {
      font-size: clamp(1.05rem, 3.5vw, 1.35rem);
      font-weight: 700;
      line-height: 1.3;
      word-break: break-word;
    }

    .track-path {
      margin-top: 6px;
      color: #535244;
      font-size: .78rem;
      word-break: break-all;
    }

    .track-status {
      margin-top: 8px;
      color: #41483f;
      font-size: .82rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .message {
      min-height: 20px;
      margin: 8px 0 0;
      color: #27471f;
      font-size: .8rem;
      font-weight: 600;
    }

    .message.is-error { color: #9e2925; font-weight: 700; }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(16px, 6vw, 28px);
      padding: 25px 0 22px;
    }

    .control-button {
      width: 52px;
      height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 4px solid #111a19;
      cursor: pointer;
      box-shadow: 4px 4px 0 #0d1313;
      transition: transform 120ms steps(2, end), box-shadow 120ms steps(2, end);
    }

    .control-button:hover {
      transform: translate(-3px, -3px);
      box-shadow: 7px 7px 0 #0d1313;
    }

    .play-button {
      width: 69px;
      height: 69px;
      border-color: #641f1e;
      box-shadow: 5px 5px 0 #451a18;
    }

    .playlist-container {
      max-height: 320px;
      overflow-y: auto;
      border: 4px solid #171f20;
      background: #bfba9c;
      scrollbar-color: #d64035 #3a4541;
      scrollbar-width: thin;
    }

    .playlist-header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      border-bottom: 4px solid #171f20;
      background: #3d4b42;
      text-transform: uppercase;
    }

    .folder-group { border-bottom: 3px solid #4d554b; }

    .folder-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 13px;
      border-bottom: 2px solid #645d48;
      background: #8b5a36;
      color: #fff4d3;
      font-size: .82rem;
      font-weight: 700;
    }

    .folder-title-wrap {
      display: flex;
      align-items: center;
      gap: 9px;
      flex: 1;
      min-width: 0;
    }

    .folder-checkbox {
      width: 16px;
      height: 16px;
      accent-color: var(--redstone);
      cursor: pointer;
    }

    .folder-toggle-btn {
      background: transparent;
      border: 0;
      color: #fff4d3;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0;
      font: inherit;
      text-align: left;
      flex: 1;
    }

    .folder-items { display: block; }
    .folder-group.collapsed .folder-items { display: none; }

    .playlist-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px 8px 18px;
      border-bottom: 2px solid #aaa384;
      background: #d9d0b1;
      color: #27302d;
      font-size: .85rem;
    }

    .playlist-item.disabled {
      opacity: .5;
      background: #c5be9e;
    }

    .playlist-item.active {
      background: var(--redstone);
      color: #fff8db;
      font-weight: 700;
    }

    .item-select-btn {
      background: transparent;
      border: 0;
      color: inherit;
      font: inherit;
      text-align: left;
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 0;
    }

    .track-number {
      min-width: 22px;
      font-size: .72rem;
      font-weight: 700;
      opacity: .8;
    }

    .track-name {
      flex: 1;
      word-break: break-word;
    }

    .reorder-btns {
      display: flex;
      gap: 3px;
    }

    .reorder-btn {
      background: #4b5051;
      color: #fff;
      border: 1px solid #111718;
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      font-size: 10px;
    }

    .reorder-btn:disabled {
      opacity: .3;
      cursor: not-allowed;
    }

    .empty-state {
      padding: 25px 15px;
      color: #515242;
      font-size: .86rem;
      text-align: center;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"></script>
</head>
<body>
  <main class="player-shell" aria-label="Pemutar musik lokal Minecraft">
    <section class="player-card">
      <header class="top-row">
        <div>
          <div class="eyebrow-container">
            <p class="eyebrow">ARSIP MUSIK PETUALANG</p>
            <button id="notificationBtn" class="action-btn secondary" type="button" title="Aktifkan Notifikasi Latar Belakang">
              <i data-lucide="bell" style="width:12px;height:12px"></i> Notifikasi
            </button>
            <button id="clearStorageBtn" class="action-btn secondary" type="button" style="display: none;" title="Hapus Lagu Tersimpan di Browser">
              <i data-lucide="trash-2" style="width:12px;height:12px"></i> Hapus Simpanan
            </button>
            <button id="installPwaBtn" class="action-btn pwa-install-btn" type="button">
              <i data-lucide="download" style="width:12px;height:12px"></i> Install App
            </button>
          </div>
          <h1 id="player-title" style="color: rgb(255, 244, 211); font-size: 30px;">Minecraft Music Player</h1>
        </div>
        <div class="jukebox" aria-hidden="true"></div>
      </header>
      
      <label class="upload-button" for="folderInput" style="background: rgb(95, 159, 61); color: rgb(255, 255, 255);">
        <i data-lucide="folder-open" aria-hidden="true" style="width:20px;height:20px"></i> 
        <span style="color: rgb(255, 255, 165); font-weight: 700;">Pilih Folder Musik</span> 
        <input type="file" id="folderInput" webkitdirectory directory multiple accept="audio/*"> 
      </label>

      <section class="track-info" aria-live="polite">
        <div class="track-title" id="trackTitle" style="color: rgb(28, 37, 37);">Belum ada lagu dipilih</div>
        <div class="track-path" id="trackPath"></div>
        <div class="track-status" id="trackStatus">— / —</div>
        <p id="playerMessage" class="message" role="status"></p>
      </section>

      <audio id="audioPlayer" preload="auto"></audio>

      <nav class="controls" aria-label="Kontrol pemutaran">
        <button id="prevBtn" type="button" class="control-button" style="background: rgb(217, 208, 177);"> 
          <i data-lucide="skip-back" style="width:21px;height:21px"></i> 
        </button> 
        <button id="playBtn" type="button" class="control-button play-button" style="background: rgb(214, 64, 53); color: rgb(255, 248, 219);"> 
          <i data-lucide="play" id="playIcon" style="width:28px;height:28px;fill:currentColor"></i> 
        </button> 
        <button id="nextBtn" type="button" class="control-button" style="background: rgb(217, 208, 177);"> 
          <i data-lucide="skip-forward" style="width:21px;height:21px"></i> 
        </button>
      </nav>

      <section class="playlist-container" id="playlist">
        <div class="playlist-header" style="background: rgb(61, 75, 66); color: rgb(255, 244, 211);">
          <span style="font-weight: 700; font-size: 16px;">Playlist Sub-Folder</span> 
          <span id="playlistCount" style="font-weight: 700;">00 tracks</span>
        </div>
        <div id="playlistTree">
          <div id="emptyPlaylist" class="empty-state">Daftar lagu akan muncul di sini</div>
        </div>
      </section>
    </section>
  </main>

  <script>
    const MINECRAFT_DISC_ICON = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23263032'/><circle cx='50' cy='50' r='40' fill='%23191d1d'/><circle cx='50' cy='50' r='28' fill='%23dc5b47'/><circle cx='50' cy='50' r='18' fill='%23e5b851'/><circle cx='50' cy='50' r='8' fill='%23111718'/></svg>";

    let swRegistration = null;
    let wakeLock = null;
    let deferredPrompt = null;

    // --- PWA Installation Event Listener ---
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const installBtn = document.getElementById('installPwaBtn');
      if (installBtn) {
        installBtn.style.display = 'inline-flex';
        installBtn.addEventListener('click', () => {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then(() => {
            installBtn.style.display = 'none';
            deferredPrompt = null;
          });
        });
      }
    });

    (function initPWA() {
      const manifestObj = {
        name: "Minecraft Music Player",
        short_name: "MinecraftMusic",
        start_url: "./",
        display: "standalone",
        background_color: "#315c31",
        theme_color: "#315c31",
        icons: [{ src: MINECRAFT_DISC_ICON, sizes: "192x192 512x512", type: "image/svg+xml" }]
      };
      const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: 'application/json' });
      const manifestUrl = URL.createObjectURL(manifestBlob);
      const manifestLink = document.createElement('link');
      manifestLink.rel = 'manifest';
      manifestLink.href = manifestUrl;
      document.head.appendChild(manifestLink);

      if ('serviceWorker' in navigator) {
        const swCode = `
          self.addEventListener('install', (e) => self.skipWaiting());
          self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));
          self.addEventListener('fetch', (e) => e.respondWith(fetch(e.request).catch(() => new Response('Offline'))));
          self.addEventListener('notificationclick', (e) => {
            e.notification.close();
            e.waitUntil(
              self.clients.matchAll({ type: 'window', includeUncontrolled: true }).then((clients) => {
                if (clients && clients.length) {
                  clients[0].focus();
                  clients[0].postMessage({ type: 'MEDIA_ACTION', action: e.action || 'focus' });
                }
              })
            );
          });
        `;
        const swBlob = new Blob([swCode], { type: 'text/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(swBlob))
          .then(reg => { swRegistration = reg; })
          .catch(err => console.log('SW Note:', err));

        navigator.serviceWorker.addEventListener('message', (e) => {
          if (e.data && e.data.type === 'MEDIA_ACTION') handleBackgroundAction(e.data.action);
        });
      }
    })();

    const DB_NAME = 'MinecraftMusicPlayerDB_v3';
    const DB_VERSION = 1;

    function openMusicDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('tracks')) {
            db.createObjectStore('tracks', { keyPath: 'id' });
          }
          if (!db.objectStoreNames.contains('settings')) {
            db.createObjectStore('settings', { keyPath: 'key' });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = (e) => reject(e.target.error);
      });
    }

    async function saveAllTracksToStorage(filesList, folderStatesObj) {
      try {
        showMessage('Membaca & mengompres file ke memori lokal...', false);
        
        // Membaca file ke ArrayBuffer terlebih dahulu secara asinkron
        const processedTracks = [];
        for (let i = 0; i < filesList.length; i++) {
          const item = filesList[i];
          try {
            const buffer = await item.file.arrayBuffer();
            processedTracks.push({
              id: item.id,
              name: item.file.name,
              relativePath: item.file.webkitRelativePath || item.file.name,
              folderName: item.folderName,
              type: item.file.type || 'audio/mpeg',
              data: buffer
            });
            if (i % 5 === 0 || i === filesList.length - 1) {
              showMessage(`Menyimpan ${i + 1} dari ${filesList.length} lagu...`, false);
            }
          } catch (e) {
            console.error('File read error:', item.file.name, e);
          }
        }

        // Buka transaksi IndexedDB dan simpan sekaligus
        const db = await openMusicDB();
        const tx = db.transaction(['tracks', 'settings'], 'readwrite');
        const tracksStore = tx.objectStore('tracks');
        const settingsStore = tx.objectStore('settings');

        tracksStore.clear();
        processedTracks.forEach(rec => tracksStore.put(rec));
        settingsStore.put({ key: 'folderStates', value: folderStatesObj });

        await new Promise((res, rej) => {
          tx.oncomplete = res;
          tx.onerror = (e) => rej(e.target.error);
        });

        document.getElementById('clearStorageBtn').style.display = 'inline-flex';
        showMessage(`✓ Berhasil menyimpan ${processedTracks.length} lagu! Tersimpan permanen.`, false);
      } catch (err) {
        console.error('IndexedDB Save Error:', err);
        showMessage('Peringatan: Memori browser penuh. Sebagian lagu mungkin tidak tersimpan.', true);
      }
    }

    async function loadTracksFromStorage() {
      try {
        const db = await openMusicDB();
        const tx = db.transaction(['tracks', 'settings'], 'readonly');
        const tracksStore = tx.objectStore('tracks');
        const settingsStore = tx.objectStore('settings');

        const tracksData = await new Promise((res, rej) => {
          const req = tracksStore.getAll();
          req.onsuccess = () => res(req.result);
          req.onerror = rej;
        });

        if (!tracksData || tracksData.length === 0) return false;

        const settingsData = await new Promise((res, rej) => {
          const req = settingsStore.get('folderStates');
          req.onsuccess = () => res(req.result);
          req.onerror = rej;
        });

        rawFiles = tracksData.map((rec) => {
          const blob = new Blob([rec.data], { type: rec.type });
          const file = new File([blob], rec.name, { type: rec.type, lastModified: Date.now() });
          Object.defineProperty(file, 'webkitRelativePath', { value: rec.relativePath, writable: false });
          return { id: rec.id, file: file, folderName: rec.folderName };
        });

        folderStates = (settingsData && settingsData.value) ? settingsData.value : {};
        if (Object.keys(folderStates).length === 0) {
          rawFiles.forEach(item => { folderStates[item.folderName] = true; });
        }

        buildActivePlaylist();
        
        // Restorasi status lagu & detik pemutaran terakhir
        const savedIndex = parseInt(localStorage.getItem('mc_last_index') || '0', 10);
        const savedTime = parseFloat(localStorage.getItem('mc_last_time') || '0');

        currentIndex = (savedIndex >= 0 && savedIndex < activePlaylist.length) ? savedIndex : 0;
        renderPlaylist();

        if (activePlaylist.length) {
          loadTrack(currentIndex, false);
          if (savedTime > 0 && !isNaN(savedTime)) {
            audioPlayer.currentTime = savedTime;
          }
        }

        document.getElementById('clearStorageBtn').style.display = 'inline-flex';
        showMessage(`✓ Memuat ${rawFiles.length} lagu tersimpan dari memori browser.`, false);
        return true;
      } catch (err) {
        console.error('IndexedDB Load Error:', err);
        return false;
      }
    }

    async function clearStorageData() {
      try {
        const db = await openMusicDB();
        const tx = db.transaction(['tracks', 'settings'], 'readwrite');
        tx.objectStore('tracks').clear();
        tx.objectStore('settings').clear();
        await new Promise((res) => { tx.oncomplete = res; });

        localStorage.removeItem('mc_last_index');
        localStorage.removeItem('mc_last_time');

        rawFiles = [];
        activePlaylist = [];
        folderStates = {};
        if (activeObjectUrl) URL.revokeObjectURL(activeObjectUrl);
        audioPlayer.src = '';

        resetTrackInfo();
        renderPlaylist();
        updatePlayControl(false);
        document.getElementById('clearStorageBtn').style.display = 'none';
        showMessage('Simpanan musik lokal telah dibersihkan.', false);
      } catch (err) {
        console.error('IndexedDB Clear Error:', err);
      }
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }

    function releaseWakeLock() {
      if (wakeLock) {
        wakeLock.release().catch(() => {});
        wakeLock = null;
      }
    }

    const notificationBtn = document.getElementById('notificationBtn');
    function updateNotificationBtnState() {
      if (!('Notification' in window)) {
        notificationBtn.style.display = 'none';
        return;
      }
      if (Notification.permission === 'granted') {
        notificationBtn.style.background = '#5f9f3d';
        notificationBtn.title = 'Notifikasi Latar Belakang Aktif';
      } else if (Notification.permission === 'denied') {
        notificationBtn.style.background = '#8a332d';
        notificationBtn.title = 'Notifikasi Ditolak di Browser';
      }
    }

    notificationBtn.addEventListener('click', async () => {
      if (!('Notification' in window)) return;
      const permission = await Notification.requestPermission();
      updateNotificationBtnState();
      if (permission === 'granted') {
        showCustomBackgroundNotification("Notifikasi Aktif!", "Kontrol musik dapat digunakan di luar browser.");
      }
    });

    updateNotificationBtnState();

    function showCustomBackgroundNotification(title, body) {
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      const options = {
        body: body,
        icon: MINECRAFT_DISC_ICON,
        badge: MINECRAFT_DISC_ICON,
        tag: 'mc-music-player-status',
        renotify: true,
        silent: true,
        actions: [
          { action: 'prev', title: '⏮ Sebelumnya' },
          { action: 'playpause', title: audioPlayer.paused ? '▶ Putar' : '⏸ Jeda' },
          { action: 'next', title: '⏭ Selanjutnya' }
        ]
      };
      if (swRegistration && swRegistration.showNotification) {
        swRegistration.showNotification(title, options).catch(() => {});
      }
    }

    function handleBackgroundAction(action) {
      switch (action) {
        case 'prev': prevTrack(); break;
        case 'next': nextTrack(); break;
        case 'playpause':
          if (activePlaylist.length) audioPlayer.paused ? playTrack() : pauseTrack();
          break;
      }
    }

    const folderInput = document.getElementById('folderInput');
    const audioPlayer = document.getElementById('audioPlayer');
    const trackTitle = document.getElementById('trackTitle');
    const trackPath = document.getElementById('trackPath');
    const trackStatus = document.getElementById('trackStatus');
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const playlistTree = document.getElementById('playlistTree');
    const emptyPlaylist = document.getElementById('emptyPlaylist');
    const playlistCount = document.getElementById('playlistCount');
    const playerMessage = document.getElementById('playerMessage');

    let rawFiles = [];
    let folderStates = {};
    let activePlaylist = [];
    let currentIndex = 0;
    let activeObjectUrl = null;

    window.addEventListener('DOMContentLoaded', () => {
      loadTracksFromStorage();
    });

    // Simpan posisi pemutaran sebelum tab dimatikan oleh browser
    window.addEventListener('pagehide', () => {
      if (audioPlayer.currentTime > 0) {
        localStorage.setItem('mc_last_time', audioPlayer.currentTime.toString());
      }
    });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && audioPlayer.currentTime > 0) {
        localStorage.setItem('mc_last_time', audioPlayer.currentTime.toString());
      }
    });

    document.getElementById('clearStorageBtn').addEventListener('click', clearStorageData);

    function updatePlayControl(isPlaying) {
      playBtn.setAttribute('aria-pressed', String(isPlaying));
      playBtn.setAttribute('aria-label', isPlaying ? 'Jeda lagu' : 'Putar lagu');
      playBtn.innerHTML = `<i data-lucide="${isPlaying ? 'pause' : 'play'}" style="width:28px;height:28px;${isPlaying ? '' : 'fill:currentColor'}"></i>`;
      lucide.createIcons();

      if ('mediaSession' in navigator) {
        navigator.mediaSession.playbackState = isPlaying ? 'playing' : 'paused';
      }
    }

    function showMessage(message, isError) {
      playerMessage.textContent = message;
      playerMessage.classList.toggle('is-error', Boolean(isError));
    }

    folderInput.addEventListener('change', async (event) => {
      const files = Array.from(event.target.files);
      const audioFiles = files.filter((file) =>
        file.type.startsWith('audio/') || file.name.match(/\.(mp3|wav|m4a|ogg|flac|aac)$/i)
      );

      if (!audioFiles.length) {
        rawFiles = [];
        activePlaylist = [];
        renderPlaylist();
        resetTrackInfo();
        showMessage('Tidak ditemukan file musik dalam folder ini.', true);
        return;
      }

      audioFiles.sort((a, b) => {
        const pathA = a.webkitRelativePath || a.name;
        const pathB = b.webkitRelativePath || b.name;
        return pathA.localeCompare(pathB, 'id', { numeric: true });
      });

      rawFiles = audioFiles.map((file, id) => ({
        id,
        file,
        folderName: getFolderName(file)
      }));

      folderStates = {};
      rawFiles.forEach(item => { folderStates[item.folderName] = true; });

      buildActivePlaylist();
      currentIndex = 0;
      renderPlaylist();
      
      if (activePlaylist.length) {
        loadTrack(currentIndex, true);
        playTrack();
      }

      await saveAllTracksToStorage(rawFiles, folderStates);
    });

    function getFolderName(file) {
      const relativePath = file.webkitRelativePath || file.name;
      const pathParts = relativePath.split('/');
      return pathParts.length > 1 ? pathParts.slice(0, -1).join('/') : 'Folder Utama';
    }

    function buildActivePlaylist() {
      activePlaylist = rawFiles.filter(item => folderStates[item.folderName]);
    }

    function resetTrackInfo() {
      trackTitle.textContent = 'Belum ada lagu dipilih';
      trackPath.textContent = '';
      trackStatus.textContent = '— / —';
    }

    function loadTrack(index, autoPlay = false) {
      if (!activePlaylist.length) {
        audioPlayer.src = '';
        resetTrackInfo();
        return;
      }

      if (index >= activePlaylist.length) index = 0;
      if (index < 0) index = activePlaylist.length - 1;
      currentIndex = index;

      localStorage.setItem('mc_last_index', currentIndex.toString());

      if (activeObjectUrl) URL.revokeObjectURL(activeObjectUrl);
      const currentItem = activePlaylist[currentIndex];
      activeObjectUrl = URL.createObjectURL(currentItem.file);
      audioPlayer.src = activeObjectUrl;

      trackTitle.textContent = currentItem.file.name;
      trackPath.textContent = currentItem.file.webkitRelativePath ? `📁 ${currentItem.file.webkitRelativePath}` : '';
      trackStatus.textContent = `Lagu ${currentIndex + 1} dari ${activePlaylist.length}`;

      updatePlaylistHighlight();
      setupMediaSession(currentItem.file.name, currentItem.folderName);

      if (autoPlay) {
        playTrack();
      }
    }

    function playTrack() {
      if (!activePlaylist.length) return;
      audioPlayer.play()
        .then(() => {
          updatePlayControl(true);
          requestWakeLock();
          if (document.hidden && activePlaylist[currentIndex]) {
            showCustomBackgroundNotification(
              activePlaylist[currentIndex].file.name,
              `Memutar dari: ${activePlaylist[currentIndex].folderName}`
            );
          }
        })
        .catch(() => {
          updatePlayControl(false);
          showMessage('Tekan tombol putar untuk mengaktifkan suara.', false);
        });
    }
    
    function pauseTrack() {
      audioPlayer.pause();
      updatePlayControl(false);
      releaseWakeLock();
      if (document.hidden && activePlaylist[currentIndex]) {
        showCustomBackgroundNotification(
          "⏸ Dijeda: " + activePlaylist[currentIndex].file.name,
          `Minecraft Music Player`
        );
      }
    }

    playBtn.addEventListener('click', () => {
      if (!activePlaylist.length) {
        showMessage('Tidak ada lagu aktif yang dapat diputar.', true);
        return;
      }
      audioPlayer.paused ? playTrack() : pauseTrack();
    });

    function nextTrack() {
      if (!activePlaylist.length) return;
      loadTrack((currentIndex + 1) % activePlaylist.length, true);
    }

    function prevTrack() {
      if (!activePlaylist.length) return;
      loadTrack((currentIndex - 1 + activePlaylist.length) % activePlaylist.length, true);
    }

    nextBtn.addEventListener('click', nextTrack);
    prevBtn.addEventListener('click', prevTrack);
    audioPlayer.addEventListener('ended', nextTrack);

    audioPlayer.addEventListener('timeupdate', () => {
      if (audioPlayer.currentTime > 0) {
        localStorage.setItem('mc_last_time', audioPlayer.currentTime.toString());
      }
      if ('mediaSession' in navigator && 'setPositionState' in navigator.mediaSession) {
        if (audioPlayer.duration && !isNaN(audioPlayer.duration)) {
          try {
            navigator.mediaSession.setPositionState({
              duration: audioPlayer.duration,
              playbackRate: audioPlayer.playbackRate || 1,
              position: audioPlayer.currentTime
            });
          } catch (e) {}
        }
      }
    });

    async function moveItem(fromIndex, toIndex) {
      if (toIndex < 0 || toIndex >= rawFiles.length) return;
      const currentPlayingItem = activePlaylist[currentIndex];

      const temp = rawFiles[fromIndex];
      rawFiles[fromIndex] = rawFiles[toIndex];
      rawFiles[toIndex] = temp;

      buildActivePlaylist();
      
      if (currentPlayingItem) {
        const newIdx = activePlaylist.findIndex(item => item.id === currentPlayingItem.id);
        if (newIdx !== -1) currentIndex = newIdx;
      }

      renderPlaylist();
      await saveAllTracksToStorage(rawFiles, folderStates);
    }

    function renderPlaylist() {
      playlistTree.replaceChildren();

      if (!rawFiles.length) {
        playlistTree.appendChild(emptyPlaylist);
        playlistCount.textContent = '00 tracks';
        return;
      }

      playlistCount.textContent = `${String(activePlaylist.length).padStart(2, '0')} active tracks`;

      const grouped = {};
      rawFiles.forEach((item, rawIndex) => {
        if (!grouped[item.folderName]) grouped[item.folderName] = [];
        grouped[item.folderName].push({ ...item, rawIndex });
      });

      Object.keys(grouped).forEach((folderName) => {
        const folderGroup = document.createElement('div');
        folderGroup.className = 'folder-group';
        const items = grouped[folderName];

        const folderHeader = document.createElement('div');
        folderHeader.className = 'folder-header';

        const titleWrap = document.createElement('div');
        titleWrap.className = 'folder-title-wrap';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'folder-checkbox';
        checkbox.checked = Boolean(folderStates[folderName]);
        checkbox.addEventListener('change', async (e) => {
          folderStates[folderName] = e.target.checked;
          const playingItem = activePlaylist[currentIndex];
          
          buildActivePlaylist();
          
          if (playingItem) {
            const newIndex = activePlaylist.findIndex(i => i.id === playingItem.id);
            if (newIndex !== -1) {
              currentIndex = newIndex;
            } else if (activePlaylist.length) {
              loadTrack(0, false);
            } else {
              audioPlayer.pause();
              updatePlayControl(false);
              resetTrackInfo();
            }
          }

          renderPlaylist();
          await saveAllTracksToStorage(rawFiles, folderStates);
        });

        const toggleBtn = document.createElement('button');
        toggleBtn.className = 'folder-toggle-btn';
        toggleBtn.innerHTML = `<i data-lucide="folder" style="width:16px;height:16px"></i> <span>${folderName} (${items.length})</span>`;
        toggleBtn.addEventListener('click', () => folderGroup.classList.toggle('collapsed'));

        titleWrap.append(checkbox, toggleBtn);
        folderHeader.append(titleWrap);

        const itemsContainer = document.createElement('div');
        itemsContainer.className = 'folder-items';

        items.forEach((item) => {
          const itemEl = document.createElement('div');
          const isFolderActive = folderStates[folderName];
          const activeIndex = activePlaylist.findIndex(a => a.id === item.id);
          const isActiveTrack = activeIndex === currentIndex && isFolderActive;

          itemEl.className = `playlist-item ${!isFolderActive ? 'disabled' : ''} ${isActiveTrack ? 'active' : ''}`;

          const selectBtn = document.createElement('button');
          selectBtn.className = 'item-select-btn';
          selectBtn.innerHTML = `
            <span class="track-number">${activeIndex !== -1 ? String(activeIndex + 1).padStart(2, '0') : '--'}</span>
            <span class="track-name">${item.file.name}</span>
          `;

          selectBtn.addEventListener('click', () => {
            if (!folderStates[folderName]) return;
            if (activeIndex !== -1) {
              loadTrack(activeIndex, true);
            }
          });

          const reorderBtns = document.createElement('div');
          reorderBtns.className = 'reorder-btns';

          const upBtn = document.createElement('button');
          upBtn.className = 'reorder-btn';
          upBtn.innerHTML = '▲';
          upBtn.disabled = item.rawIndex === 0;
          upBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            moveItem(item.rawIndex, item.rawIndex - 1);
          });

          const downBtn = document.createElement('button');
          downBtn.className = 'reorder-btn';
          downBtn.innerHTML = '▼';
          downBtn.disabled = item.rawIndex === rawFiles.length - 1;
          downBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            moveItem(item.rawIndex, item.rawIndex + 1);
          });

          reorderBtns.append(upBtn, downBtn);
          itemEl.append(selectBtn, reorderBtns);
          itemsContainer.appendChild(itemEl);
        });

        folderGroup.append(folderHeader, itemsContainer);
        playlistTree.appendChild(folderGroup);
      });

      lucide.createIcons();
    }

    function updatePlaylistHighlight() {
      renderPlaylist();
    }

    function setupMediaSession(title, albumName = 'Folder Musik Lokal') {
      if (!('mediaSession' in navigator)) return;

      navigator.mediaSession.metadata = new MediaMetadata({
        title: title,
        artist: 'Minecraft Music Player',
        album: albumName,
        artwork: [
          { src: MINECRAFT_DISC_ICON, sizes: '96x96', type: 'image/svg+xml' },
          { src: MINECRAFT_DISC_ICON, sizes: '512x512', type: 'image/svg+xml' }
        ]
      });

      navigator.mediaSession.setActionHandler('play', playTrack);
      navigator.mediaSession.setActionHandler('pause', pauseTrack);
      navigator.mediaSession.setActionHandler('previoustrack', prevTrack);
      navigator.mediaSession.setActionHandler('nexttrack', nextTrack);
      
      try {
        navigator.mediaSession.setActionHandler('seekto', (details) => {
          if (details.seekTime && audioPlayer.duration) {
            audioPlayer.currentTime = details.seekTime;
          }
        });
      } catch (e) {}
    }

    lucide.createIcons();
  </script>
</body>
</html>
